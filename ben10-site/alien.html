<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalhes do Alien | Ben 10</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo"><img src="img/ben10-logo.svg" alt="Ben 10"></a>
      <nav class="nav-menu">
        <a href="index.html">Sortear</a>
        <a href="aliens.html" class="active">Aliens</a>
      </nav>
    </div>
  </header>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main>
    <section class="alien-detalhe container" id="alienDetalhe" hidden>

      <a href="aliens.html" class="back-link">&larr; Voltar para a lista</a>

      <!-- Hero: imagem grande + informações principais -->
      <div class="detalhe-hero">
        <div class="detalhe-hero__image-wrap">
          <img id="detalheImg" class="detalhe-hero__image" src="" alt="" />
        </div>
        <div class="detalhe-hero__info">
          <h1 id="detalheNome">NOME DO ALIEN</h1>
          <p class="detalhe-hero__tipo" id="detalheTipo">Tipo: XXXXXX</p>
          <p class="detalhe-hero__descricao" id="detalheDescricao"></p>
        </div>
      </div>

      <!-- Seção Habilidades -->
      <div class="detalhe-secao">
        <h2 class="detalhe-secao__titulo">Habilidades</h2>
        <ul class="habilidades-lista" id="habilidadesLista"></ul>
      </div>

      <!-- Seção Sobre -->
      <div class="detalhe-secao">
        <h2 class="detalhe-secao__titulo">Sobre</h2>
        <dl class="atributos-lista" id="atributosLista">
          <div class="atributo">
            <dt>Espécie:</dt>
            <dd id="atrEspecie"></dd>
          </div>
          <div class="atributo">
            <dt>Planeta de Origem:</dt>
            <dd id="atrPlaneta"></dd>
          </div>
          <div class="atributo">
            <dt>Altura:</dt>
            <dd id="atrAltura"></dd>
          </div>
          <div class="atributo">
            <dt>Peso:</dt>
            <dd id="atrPeso"></dd>
          </div>
        </dl>
      </div>
    </section>

    <!-- Exibido caso o id da URL não corresponda a nenhum alien -->
    <section class="alien-nao-encontrado container" id="alienNaoEncontrado" hidden>
      <h1>Alien não encontrado</h1>
      <p>Não conseguimos localizar esse alien na base de dados.</p>
      <a href="aliens.html" class="btn btn-primary">Ver todos os aliens</a>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2025 - Site Ben 10</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/detalhe.js"></script>
</body>
</html>
