<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todos os Aliens | Ben 10</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo"><img src="img/ben10-logo.svg" alt="Ben 10"></a>
      <nav class="nav-menu">
        <a href="index.html">Sortear</a>
        <a href="aliens.html" class="active">Aliens</a>
      </nav>
    </div>
  </header>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main>
    <section class="aliens-section container">
      <h1 class="page-title">Todos os Aliens</h1>

      <!-- Barra de busca -->
      <div class="search-bar">
        <input
          type="text"
          id="searchInput"
          placeholder="Buscar alien..."
          autocomplete="off"
        />
      </div>

      <!-- Grid de aliens (preenchido via JS) -->
      <div class="aliens-grid" id="aliensGrid"></div>

      <!-- Mensagem exibida quando a busca não encontra resultados -->
      <p class="no-results" id="noResults" hidden>
        Nenhum alien encontrado para essa busca.
      </p>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2025 - Site Ben 10</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/lista.js"></script>
</body>
</html>
