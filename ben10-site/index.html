<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sortear Alien | Ben 10</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo"><img src="img/ben10-logo.svg" alt="Ben 10"></a>
      <nav class="nav-menu">
        <a href="index.html" class="active">Sortear</a>
        <a href="aliens.html">Aliens</a>
      </nav>
    </div>
  </header>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main>
    <section class="sortear-section container">
      <h1 class="page-title">Sorteie um Alien!</h1>
      <p class="page-subtitle">Clique no botão para sortear um alien aleatório</p>

      <!-- Card principal: estado inicial = placeholder (sem alien sorteado ainda) -->
      <div class="alien-card" id="alienCard" data-state="empty">
        <div class="alien-card__image-wrap">
          <span class="alien-card__placeholder" aria-hidden="true">✕</span>
          <img
            src=""
            alt=""
            id="alienImg"
            class="alien-card__image"
            hidden
          />
        </div>
        <h2 class="alien-card__nome" id="alienNome">NOME DO ALIEN</h2>
        <p class="alien-card__tipo" id="alienTipo">Tipo: XXXXXX</p>
      </div>

      <!-- Botões de ação -->
      <div class="sortear-actions">
        <button type="button" class="btn btn-primary" id="btnSortear">Sortear</button>
        <a href="aliens.html" class="btn btn-secondary">Ver todos os aliens</a>
      </div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2025 - Site Ben 10</p>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sortear.js"></script>
</body>
</html>
